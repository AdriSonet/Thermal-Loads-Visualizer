<!doctype html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1b1b; --ink-2: #3a3a3a; --muted: #6e6b66; --line: #e3dfd8; --line-2: #efece6;
    --paper: #fbfaf7; --surface: rgba(252,251,248,.96); --chip: #f1eee8; --hover: #f3f0ea;
    --focus: #2f6fc0; --r-panel: 12px; --r-ctl: 8px;
    --shadow: 0 8px 28px rgba(40,32,20,.08), 0 1px 3px rgba(40,32,20,.06);
    --nav-w: 264px; --card-w: 448px; --gap: 14px; --bar-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: #cfe0f5; color: var(--ink); }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  * { scrollbar-width: thin; scrollbar-color: #d6d1c8 transparent; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.fill { fill: currentColor; stroke: none; }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .lab { position: absolute; transform: translate(10px, -50%); font-size: 12px; white-space: nowrap; background: rgba(252,251,248,.9); padding: 1px 5px; border-radius: 4px; }
  .lab b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .lab.est { color: #7a5b00; }

  /* ---- panels share one surface */
  #nav, #card { position: fixed; z-index: 3; background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow); }

  /* ---- navigator */
  #nav { top: var(--gap); left: var(--gap); bottom: calc(var(--bar-h) + 6px); width: var(--nav-w); display: flex; flex-direction: column; overflow: hidden; transition: width .28s cubic-bezier(.2,.8,.2,1); }
  .nav-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 16px; }
  .brand { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-ctl); border: 0; background: transparent; color: var(--ink-2); }
  .icon:hover { background: var(--hover); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; margin: 0 12px; background: var(--chip); border-radius: 10px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  #steps { flex: 1; overflow: auto; padding: 10px 8px 8px; }
  #steps .g { font-size: 12px; font-weight: 600; color: var(--muted); padding: 12px 8px 4px; }
  #steps .g:first-child { padding-top: 2px; }
  #steps .s { width: 100%; text-align: left; border: 0; background: transparent; font-size: 13px; line-height: 1.35; padding: 6px 8px; border-radius: var(--r-ctl); display: flex; gap: 10px; color: var(--ink-2); }
  #steps .s .n { color: #a29d95; font-variant-numeric: tabular-nums; width: 16px; flex: none; text-align: right; }
  #steps .s:hover { background: var(--hover); }
  #steps .s.on { background: var(--ink); color: #fff; }
  #steps .s.on .n { color: #9c9890; }
  #steps .el { width: 100%; text-align: left; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: var(--r-ctl); font-size: 13.5px; font-weight: 500; color: var(--ink); }
  #steps .el:hover { background: var(--hover); }
  #steps .el .c { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  #steps .el svg { transition: transform .2s; color: var(--muted); }
  #steps .el.open svg { transform: rotate(90deg); }
  #steps .sub { padding: 0 0 6px 14px; margin-left: 8px; border-left: 1px solid var(--line); }
  #steps .sub.nest { padding-bottom: 2px; }
  #steps .el.cpt { align-items: flex-start; line-height: 1.3; }
  #steps .el.cpt svg { margin-top: 1px; }
  #steps .cdef { margin: -2px 8px 6px 32px; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .seg button { padding: 6px 4px; }
  #steps .sub.nest .el { font-weight: 400; }
  .nav-foot { padding: 10px 0 12px; border-top: 1px solid var(--line-2); display: grid; gap: 8px; }
  .nav-foot .src { margin: 0 16px; font-size: 11px; color: var(--muted); line-height: 1.4; }
  .rail { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; }
  .rail .pos { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  body.navclosed #nav { width: 56px; }
  body.navclosed #nav > :not(.rail) { display: none; }
  body.navclosed .rail { display: flex; }

  /* ---- step card */
  #card { top: var(--gap); bottom: calc(var(--bar-h) + 6px); left: calc(var(--nav-w) + 2 * var(--gap)); width: var(--card-w); overflow: auto; padding: 16px 18px 18px; transition: left .28s cubic-bezier(.2,.8,.2,1); }
  body.navclosed #card { left: calc(56px + 2 * var(--gap)); }
  #card .head { display: flex; align-items: flex-start; gap: 10px; }
  #card h2 { flex: 1; font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; margin: 2px 0 0; text-wrap: balance; }
  #card .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 7px; white-space: nowrap; }
  #card .say { font-size: 14px; line-height: 1.5; margin: 10px 0 0; color: var(--ink-2); max-width: 60ch; }
  #card.folded { bottom: auto; }
  #chapBar { margin: -2px 0 12px; }
  #chapBar .segs { display: flex; gap: 3px; }
  #chapBar .segs i { flex: 1; height: 3px; border-radius: 2px; background: var(--line-2); }
  #chapBar .segs i.done { background: #b9b5ae; }
  #chapBar .segs i.now { background: var(--ink); }
  #chapBar .lbl { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  #card .aim { font-size: 13px; line-height: 1.5; margin: 10px 0 0; padding: 8px 10px; background: var(--chip); border-radius: 8px; color: var(--ink-2); max-width: 60ch; }
  #card .aim b { color: var(--ink); font-weight: 600; }
  #chapEnd { margin-top: 14px; }
  #chapEnd p { font-size: 13.5px; line-height: 1.5; margin: 4px 0 10px; color: var(--ink-2); max-width: 60ch; }
  #chapEnd .q { color: var(--ink); font-weight: 500; }
  #chapEnd .reveal { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--ink); }
  #chapEnd .reveal[hidden] { display: none; }
  .clinks { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  .clinks button { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; }
  .clinks button:hover { background: var(--chip); }
  #condBody .linked { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 6px; }
  .modenote { margin: 6px 16px 2px; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  #card.folded #cBody { display: none; }
  .sect { font-size: 12px; font-weight: 600; color: var(--muted); margin: 18px 0 7px; display: flex; align-items: center; gap: 8px; }
  .sect::after { content: ""; flex: 1; border-top: 1px solid var(--line-2); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
  .kpi { background: var(--chip); border-radius: var(--r-ctl); padding: 8px 10px 9px; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .kpi .s .sym { font-style: italic; font-size: 13px; color: var(--ink); }
  .kpi .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; letter-spacing: -.01em; }
  .kpi .l { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .formula { border: 1px solid var(--line); border-radius: var(--r-ctl); background: #fff; }
  .formula .eq { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 4px 8px; padding: 9px 12px; border-top: 1px solid var(--line-2); font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.5; }
  .formula .eq:first-child { border-top: 0; }
  .formula .eq:not(:has(> .res)) { display: block; }
  .formula .eq .sym { font-family: "IBM Plex Sans"; font-style: italic; font-size: 14px; }
  .formula .eq .sub { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
  .formula .eq .defs { grid-column: 1 / 4; display: flex; flex-wrap: wrap; gap: 3px 14px; font-family: "IBM Plex Sans"; font-size: 11.5px; color: var(--muted); padding-top: 6px; margin-top: 3px; border-top: 1px solid var(--line-2); }
  .formula .eq .defs i { font-style: italic; color: var(--ink); margin-right: 3px; }
  .formula .eq .res { font-family: "IBM Plex Sans"; font-weight: 600; font-size: 14px; background: var(--chip); border-radius: 6px; padding: 2px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .eq sub, .eq sup, .kpi sub, .lg sub { font-size: 70%; }
  .tag { font-family: "IBM Plex Sans"; font-size: 10.5px; font-weight: 500; border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-style: normal; }
  .tag.est { background: #fbf0d0; color: #7a5b00; } .tag.geo { background: #ecebe8; color: #555; }
  .chart { border: 1px solid var(--line); border-radius: var(--r-ctl); background: #fff; padding: 10px 12px 8px; }
  .chart svg text { fill: #9a958d; }
  .chart .lg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .chart .lg b { text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart .about { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line-2); display: grid; gap: 7px; }
  .chart .about p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-2); max-width: 62ch; }
  .chart .about b { font-weight: 600; color: var(--ink); }
  .chart .about .an { font-family: "IBM Plex Sans"; color: var(--ink); margin-right: 1px; }
  .chart .about sub { font-size: 70%; }
  .chart .lg i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }

  /* ---- temperature scale */
  #right { position: fixed; z-index: 3; right: var(--gap); top: var(--gap); bottom: calc(var(--bar-h) + 6px); width: 312px; display: flex; flex-direction: column;
    background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow); overflow: hidden; font-size: 12px; }
  .rsec { padding: 14px 16px 14px; }
  .rsec + .rsec { border-top: 1px solid var(--line-2); }
  .rsec.grow { flex: 1; overflow: auto; }
  .rscroll { flex: 1; overflow: auto; }
  [data-tip] { cursor: help; }
  [data-tip]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 6px; }
  .cst[data-tip]:hover { background: #e9e5de; }
  #bal .row[data-tip]:hover .n, .gtot [data-tip]:hover, #bal .tot [data-tip]:hover, .parts [data-tip]:hover { color: var(--ink); }
  .cst .l, #bal .row .n, #bal .tot .k, .gtot .k, .gsrc .sh .n, .parts .lb { text-decoration: underline dotted #cdc8bf; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  #bal .tot .k:empty { text-decoration: none; }
  #tip { position: fixed; z-index: 20; width: 316px; background: #fff; border-radius: var(--r-panel); box-shadow: 0 12px 32px rgba(40,32,20,.16), 0 1px 3px rgba(40,32,20,.08);
    padding: 13px 15px 12px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); pointer-events: none; opacity: 0; transform: translateX(6px); transition: opacity .12s, transform .12s; }
  #tip.on { opacity: 1; transform: none; }
  #tip .tt { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  #tip p { margin: 0 0 6px; }
  #tip p b { color: var(--ink); font-weight: 600; }
  #tip .tf { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; background: var(--chip); border-radius: 6px; padding: 6px 8px; margin: 6px 0; color: var(--ink); line-height: 1.6; }
  #tip .tf .g { display: block; font-family: "IBM Plex Sans"; font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  #tip sub { font-size: 70%; }
  #tip .sp { margin-top: 8px; border-top: 1px solid var(--line-2); padding-top: 8px; }
  #tip .sp svg text { fill: #9a958d; }
  #tip .sl { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  #tip .sl b { text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  #tip .sl i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  #tip .est { font-size: 10.5px; color: #7a5b00; background: #fbf0d0; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .rtabs { padding: 12px 16px 0; border-top: 1px solid var(--line-2); }
  .rtabs .seg { margin: 0; }
  .rscroll .rsec { padding-top: 12px; }
  .rh .when { flex: 1; }
  .rscroll .rsec + .rsec { border-top: 1px solid var(--line-2); }
  .rh .when { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .icon.sm { width: 26px; height: 26px; margin: -4px -6px -4px 0; }
  .cgrp { font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
  .cgrp:first-child { margin-top: 0; }
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .cst { background: var(--chip); border-radius: 6px; padding: 5px 8px 6px; min-width: 0; }
  .cst .l { font-size: 10.5px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cst .v { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cst .v small { font-size: 11px; font-weight: 400; color: var(--muted); }
  .gsrc { padding: 8px 0 9px; border-top: 1px solid var(--line-2); }
  .gsrc:first-of-type { border-top: 0; padding-top: 2px; }
  .gsrc .sh { display: flex; align-items: baseline; gap: 6px; }
  .gsrc .sh .n { font-weight: 600; font-size: 12.5px; }
  .gsrc .sh .m { flex: 1; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsrc .sh .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 5px; background: var(--line-2); gap: 1px; }
  .stack i { display: block; height: 100%; }
  .parts { display: grid; grid-template-columns: auto 1fr auto auto; gap: 1px 8px; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; align-items: center; }
  .parts .d { width: 8px; height: 8px; border-radius: 2px; }
  .parts .p { color: var(--muted); text-align: right; }
  .parts .w { text-align: right; }
  .gtot { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding-top: 8px; border-top: 1px solid var(--line-2); }
  .gtot .k { color: var(--muted); } .gtot .x { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rh { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .rh .t { flex: 1; font-size: 13px; font-weight: 600; }
  #lg { width: 100%; height: 10px; border-radius: 5px; display: block; }
  .hticks { position: relative; height: 16px; margin-top: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .hticks span:first-child { transform: none; } .hticks span:last-child { transform: translateX(-100%); }
  .hticks span.air { color: var(--ink); font-weight: 600; top: 0; }
  .hticks span.air::before { content: ""; position: absolute; left: 50%; top: -9px; height: 8px; border-left: 1.5px solid var(--ink); }
  .seg.mini { margin: 0; padding: 2px; border-radius: 8px; }
  .seg.mini button { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
  #bal.folded #balBody { display: none; }
  #bal .grp { font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; display: flex; justify-content: space-between; }
  #bal .grp b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #bal .row { display: grid; grid-template-columns: 1fr 86px 64px; align-items: center; gap: 8px; padding: 2.5px 0; }
  #bal .row .n { color: var(--ink-2); line-height: 1.25; }
  #bal .row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
  #bal .row .b { position: relative; height: 8px; background: var(--line-2); border-radius: 4px; }
  #bal .row .b i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  #bal .row .b::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; border-left: 1px solid #c9c4bb; }
  .bnote { margin: -2px 0 6px; font-size: 11px; line-height: 1.4; color: var(--muted); }
  #bal .tot { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-2); }
  #bal .tot .k { color: var(--muted); }
  #bal .tot .x { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  #bal .tot .big { font-size: 18px; letter-spacing: -.01em; }
  body.clean #right { display: none; }
  #fps { position: fixed; z-index: 3; right: 18px; bottom: calc(var(--bar-h) + 10px); font: 11px "IBM Plex Mono", monospace; color: #a29d95; }

  /* ---- transport bar */
  .bar { position: fixed; left: var(--gap); right: var(--gap); bottom: 10px; height: 48px; z-index: 4; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 6px;
    background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow); }
  .transport { display: flex; align-items: center; gap: 2px; }
  .icon.play { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: #fff; }
  .icon.play:hover { background: #333; }
  #time { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; width: 104px; letter-spacing: -.01em; white-space: nowrap; }
  .track { flex: 1; position: relative; height: 34px; }
  .track input { position: absolute; inset: 4px 0 auto 0; width: 100%; accent-color: var(--ink); }
  .ticks2 { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: space-between; font-size: 10px; color: #a29d95; pointer-events: none; font-variant-numeric: tabular-nums; }
  .bar .sep { width: 1px; height: 24px; background: var(--line); }

  body.clean #nav, body.clean #card, body.clean #fps { display: none; }
</style>

  const yLab = (v, y, dy) => `<line x1="0" x2="${Wd}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ece9e3"/><text x="${Wd - 2}" y="${(y + dy).toFixed(1)}" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="3">${f0(v)}${unit}</text>`;

}

}
